<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fokus</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f1115;
  color: white;
}

.app {
  max-width: 500px;
  margin: auto;
  padding: 24px 18px;
}

h1 {
  font-size: 38px;
  margin: 10px 0 5px;
}

.subtitle {
  color: #9ca3af;
  margin-bottom: 25px;
}

.card {
  background: #191d24;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 18px;
}

.card h2 {
  margin-top: 0;
}

input {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #252a33;
  color: white;
  font-size: 16px;
  margin-bottom: 12px;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #4f7cff;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

button:active {
  transform: scale(0.98);
}

.task {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: #252a33;
  border-radius: 12px;
  margin-top: 10px;
}

.task input {
  width: 20px;
  margin: 0;
}

.done {
  text-decoration: line-through;
  color: #777;
}

.progress {
  height: 10px;
  background: #292e37;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 12px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #4f7cff;
  transition: 0.3s;
}
</style>
</head>

<body>

<div class="app">

  <h1>🎯 Fokus</h1>
  <div class="subtitle">Manje pričanja. Više napravljeno.</div>

  <div class="card">
    <h2>Što danas želiš napraviti?</h2>

    <input id="taskInput" placeholder="Npr. učiti 30 minuta">

    <button onclick="addTask()">+ Dodaj zadatak</button>
  </div>

  <div class="card">
    <h2>Moji zadaci</h2>

    <div id="tasks"></div>

    <div class="progress">
      <div class="progress-bar" id="progress"></div>
    </div>

    <p id="stats">0 / 0 završeno</p>
  </div>

</div>

<script>

let tasks = [];

function addTask() {

  const input = document.getElementById("taskInput");
  const text = input.value.trim();

  if (!text) return;

  tasks.push({
    text: text,
    done: false
  });

  input.value = "";

  renderTasks();
}

function toggleTask(index) {

  tasks[index].done = !tasks[index].done;

  renderTasks();
}

function renderTasks() {

  const container = document.getElementById("tasks");

  container.innerHTML = "";

  tasks.forEach((task, index) => {

    const div = document.createElement("div");

    div.className = "task";

    div.innerHTML = `
      <input type="checkbox"
        ${task.done ? "checked" : ""}
        onchange="toggleTask(${index})">

      <span class="${task.done ? "done" : ""}">
        ${task.text}
      </span>
    `;

    container.appendChild(div);
  });

  const completed = tasks.filter(task => task.done).length;

  document.getElementById("stats").innerText =
    `${completed} / ${tasks.length} završeno`;

  const percentage =
    tasks.length === 0 ? 0 : (completed / tasks.length) * 100;

  document.getElementById("progress").style.width =
    percentage + "%";
}

</script>

</body>
</html>
